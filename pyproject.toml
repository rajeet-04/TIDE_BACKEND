[project]
name = "tide-backend"
version = "0.1.0"
description = "Tide prediction for Haldia and Diamond Harbour (Hooghly estuary)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pdfplumber>=0.11.9",
    "pypdf>=6.13.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.18.1",
    "torch>=2.13.0",
    "utide>=0.3.1",
    "xgboost>=3.4.1",
]

[project.scripts]
tide = "tide.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tide"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: fits models on the full gauge record"]

# CPU-only torch: training runs on the CPU and the production VM has no GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
