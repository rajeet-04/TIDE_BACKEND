name: Archive INCOIS tide gauges

on:
  schedule:
    - cron: "17 3,15 * * *"  # twice a day (UTC): INCOIS 24 h files then overlap, so a late run loses nothing
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: incois-archive

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: incois-data
          path: archive
      - run: python3 tests/test_archive_incois.py
      - run: python3 src/archive_incois.py --out archive/incois
      - name: Commit new readings
        working-directory: archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "INCOIS readings $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
